# pnpm 은 의존성의 설치 스크립트를 기본으로 막는다(공급망 방어). 여기서 하나씩 판단한다.
# ⚠️ 'set this to true or false' 라는 미결정 문구를 남겨 두면 pnpm 이 ERR_PNPM_IGNORED_BUILDS
#    로 **설치 자체를 실패**시킨다. 로컬은 node_modules 가 이미 있어 안 드러나고 CI 에서만 터진다.
allowBuilds:
  # 네이티브 바이너리가 있어야 도구가 동작한다 — 허용
  '@swc/core': true # Medusa 빌드용 트랜스파일러
  esbuild: true # 플랫폼별 바이너리 검증/연결
  msgpackr-extract: true # 캐시 직렬화 가속(없으면 JS 폴백으로 느려짐)
  # 설치 스크립트가 없어도 기능에 지장이 없다 — 차단
  '@medusajs/telemetry': false # 사용 통계 수집 준비만 한다
  protobufjs: false # 7.x 에서는 사실상 정리 작업뿐

# 판매 전 점검 2026-07-28: 전이 의존성 high CVE 상향(패치 수준). 회귀는 테스트로 검증.
overrides:
  # 상한이 없으면 '>=1.1.16' 이 5.x 로 해석돼 오히려 취약 버전이 뽑힌다.
  brace-expansion@1: '>=1.1.17 <2'
  brace-expansion@>=2: '>=5.0.8'
  form-data: '>=4.0.6'
  axios: '>=1.18.0'
  js-yaml@3: '>=3.15.0'
  postcss: '>=8.5.18'
  immutable: '>=5.1.8'
  lodash: '>=4.17.24'
  '@mikro-orm/knex': '>=6.6.14'

# ── 2026-08-03 재점검 추가 ──────────────────────────────────────────────
# 런타임 경로(같은 메이저 내 패치 — 회귀 위험 낮음)
  multer: '>=2.2.0'        # DoS: 깊은 중첩 필드 / 불완전한 정리
  morgan: '>=1.10.2'       # 로그 위조(제어문자 미중화)
  body-parser: '>=1.20.6'  # 잘못된 limit 값에서 DoS
  js-yaml@>=4: '>=4.3.0'   # merge-key 체인 2차 CPU 소모
  # ⚠️ 범위를 반드시 v7 이상으로 한정한다. 무제한으로 두면 ajv 6.x 를 쓰는
  # @eslint/eslintrc 까지 8.x 로 올라가 **ESLint 가 아예 실행되지 않는다**(실측).
  # 해당 CVE 는 >=7.0.0 만 영향이므로 6.x 는 올릴 필요도 없다.
  ajv@>=7: '>=8.18.0'      # $data 옵션 ReDoS
  uuid: '>=11.1.1'         # v3/v5/v6 버퍼 경계 검사 누락
#
# 의도적으로 올리지 않은 것(메이저 변경 = 회귀 위험 > 이득):
#   vite 5.x→6.x        : Medusa 어드민 대시보드 **빌드 전용**, 런타임 노출 없음
#   react-router 6.x→7.x: 어드민 대시보드 UI 번들. 오픈리다이렉트 계열이나 메이저 변경 필요
#   @opentelemetry/*    : 프로메테우스 exporter 를 외부에 열지 않는 한 도달 불가
