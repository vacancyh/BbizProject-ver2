allowBuilds:
  '@medusajs/telemetry': set this to true or false
  '@swc/core': set this to true or false
  esbuild: set this to true or false
  msgpackr-extract: set this to true or false
  protobufjs: set this to true or false

# 판매 전 점검 2026-07-28: 전이 의존성 high CVE 상향(패치 수준). 회귀는 테스트로 검증.
overrides:
  # 상한이 없으면 '>=1.1.16' 이 5.x 로 해석돼 오히려 취약 버전이 뽑힌다.
  brace-expansion@1: '>=1.1.17 <2'
  brace-expansion@>=2: '>=5.0.8'
  form-data: '>=4.0.6'
  axios: '>=1.18.0'
  js-yaml@3: '>=3.15.0'
  postcss: '>=8.5.18'
  immutable: '>=5.1.8'
  lodash: '>=4.17.24'
  '@mikro-orm/knex': '>=6.6.14'

# ── 2026-08-03 재점검 추가 ──────────────────────────────────────────────
# 런타임 경로(같은 메이저 내 패치 — 회귀 위험 낮음)
  multer: '>=2.2.0'        # DoS: 깊은 중첩 필드 / 불완전한 정리
  morgan: '>=1.10.2'       # 로그 위조(제어문자 미중화)
  body-parser: '>=1.20.6'  # 잘못된 limit 값에서 DoS
  js-yaml@>=4: '>=4.3.0'   # merge-key 체인 2차 CPU 소모
  ajv: '>=8.18.0'          # $data 옵션 ReDoS
  uuid: '>=11.1.1'         # v3/v5/v6 버퍼 경계 검사 누락
#
# 의도적으로 올리지 않은 것(메이저 변경 = 회귀 위험 > 이득):
#   vite 5.x→6.x        : Medusa 어드민 대시보드 **빌드 전용**, 런타임 노출 없음
#   react-router 6.x→7.x: 어드민 대시보드 UI 번들. 오픈리다이렉트 계열이나 메이저 변경 필요
#   @opentelemetry/*    : 프로메테우스 exporter 를 외부에 열지 않는 한 도달 불가
