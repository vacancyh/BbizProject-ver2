name: CI

# PR/푸시 시 게이트: 앱별 독립 설치 + 타입체크/린트/빌드.
# (루트 워크스페이스 없음 — 각 앱이 자체 lockfile 로 설치)
# E2E(브라우저)·백엔드 통합·프로덕션 데이터 시드는 실행 인프라 필요 → 별도(로컬/야간) 운영.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  storefront:
    name: 스토어프론트 (typecheck·lint·unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        # pnpm 11 은 node:sqlite 를 쓴다 → Node 22 미만에서는 pnpm 자체가 실행되지 않는다.
        # 로컬 개발/검증 환경과 같은 24 로 맞춘다.
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: pnpm lint
      # ⚠️ 이 값에는 콜론+공백(": ")이 들어 있다 → 반드시 따옴표로 감쌀 것.
      #    따옴표가 없으면 YAML 이 "매핑"으로 읽어 워크플로 전체가 파싱에 실패하고,
      #    GitHub 은 잡을 하나도 만들지 않은 채 0초 만에 실패시킨다(2026-08-03~08-13 실제 사고).
      - name: "Unit tests (vitest — 순수 로직: 금액 표시·가격 필터·그리드)"
        run: pnpm test
      # next build 는 SSG 중 백엔드 호출 → CI 무백엔드에선 별도(야간 통합) 실행.

  admin:
    name: 관리자 (typecheck·lint·build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 } # 24 인 이유는 위 스토어프론트 잡 주석 참고
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests (vitest — 순수 로직 530케이스)
        run: pnpm test
      - name: Build (프로덕션 빌드 회귀 감지 — 클라이언트 렌더라 백엔드 불필요)
        run: pnpm build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:9000

  backend:
    name: 백엔드 (typecheck·lint·unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 } # 24 인 이유는 위 스토어프론트 잡 주석 참고
      - run: pnpm install --frozen-lockfile
      # 2026-07-28: integration-tests/playwright(독립 프로젝트) 를 tsconfig 에서 제외해
      # 소스 타입 에러가 0 이 되었으므로 정보성 → 게이트로 승격.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (eslint — 2026-08-03 도입, 경고 0 유지)
        run: pnpm lint
      - name: Unit tests (jest — 순수 로직 408케이스, DB 불필요)
        run: pnpm test:unit
      # medusa build 는 medusa-config env 로딩 필요 → 별도(배포 파이프라인) 실행.

  security:
    name: 보안 (시크릿 스캔·의존성 audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # 전체 이력 스캔(과거 시크릿은 .gitleaks.toml allowlist)
      # 신규 커밋에 시크릿(토큰/키/비번) 유입 시 CI 실패 — 재발 방지 게이트
      - name: 시크릿 스캔 (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 } # 24 인 이유는 위 스토어프론트 잡 주석 참고
      # 의존성 CVE — 정보성(전이 의존성 high 존재, 게이트는 통과). 추이 관찰용.
      - name: 의존성 audit (backend)
        working-directory: backend/services/api
        run: pnpm audit --audit-level=high || true
      - name: 의존성 audit (web)
        working-directory: apps/web
        run: pnpm audit --audit-level=high || true
      - name: 의존성 audit (admin)
        working-directory: apps/admin
        run: pnpm audit --audit-level=high || true
