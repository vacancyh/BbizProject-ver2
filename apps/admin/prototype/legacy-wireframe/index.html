<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>쇼핑몰 관리자 — 와이어프레임</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="wireframe.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <div id="main">
      <header id="topbar"></header>
      <main id="content"></main>
    </div>
  </div>

  <!-- Tweaks 패널 마운트 -->
  <div id="tweaks-root"></div>

  <!-- 화면 모듈 (바닐라) -->
  <script src="screens-dashboard.js"></script>
  <script src="screens-ops.js"></script>
  <script src="screens-misc.js"></script>
  <script src="shell.js"></script>

  <!-- React + Babel (Tweaks 패널 전용) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">
    const ACCENTS = {
      '슬레이트 블루': ['#5b78a6', '#e8edf4'],
      '머스크 그린':   ['#5f7d63', '#e9efe9'],
      '차콜(무채색)':  ['#5c5a54', '#ebe9e3'],
      '테라코타':      ['#a06a54', '#f1e8e2'],
    };
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "density": "comfy",
      "font": "gaegu",
      "accent": "슬레이트 블루",
      "sketch": true,
      "sidebar": false
    }/*EDITMODE-END*/;

    function applyTweaks(t){
      const r = document.documentElement;
      r.dataset.density = t.density;
      r.dataset.font = t.font;
      r.dataset.sketch = t.sketch ? 'on' : 'off';
      r.dataset.sidebar = t.sidebar ? 'collapsed' : 'expanded';
      const a = ACCENTS[t.accent] || ACCENTS['슬레이트 블루'];
      r.style.setProperty('--accent', a[0]);
      r.style.setProperty('--accent-soft', a[1]);
    }

    function TweakApp(){
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      React.useEffect(()=>{ applyTweaks(t); }, [t]);
      return (
        <TweaksPanel>
          <TweakSection label="화면 밀도" />
          <TweakRadio label="밀도" value={t.density}
            options={['compact','regular','comfy']}
            onChange={(v)=>setTweak('density', v)} />
          <TweakSection label="타이포" />
          <TweakSelect label="글꼴" value={t.font}
            options={[
              {label:'개구 (손글씨)', value:'gaegu'},
              {label:'나눔펜 (손글씨)', value:'nanumpen'},
              {label:'고운돋움 (정자체)', value:'gowun'},
            ]}
            onChange={(v)=>setTweak('font', v)} />
          <TweakToggle label="손그림 스타일" value={t.sketch}
            onChange={(v)=>setTweak('sketch', v)} />
          <TweakSection label="컬러 · 레이아웃" />
          <TweakSelect label="포인트 색" value={t.accent}
            options={Object.keys(ACCENTS)}
            onChange={(v)=>setTweak('accent', v)} />
          <TweakToggle label="사이드바 접기" value={t.sidebar}
            onChange={(v)=>setTweak('sidebar', v)} />
        </TweaksPanel>
      );
    }

    // 초기 1회 적용 (Tweaks 미실행 상태에서도 기본값 반영)
    applyTweaks(TWEAK_DEFAULTS);
    ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<TweakApp />);
  </script>
</body>
</html>
